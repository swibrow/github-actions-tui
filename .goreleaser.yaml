version: 2

builds:
  - id: darwin
    main: ./cmd/gha
    binary: gha
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - darwin
    goarch:
      - amd64
      - arm64

  - id: linux
    main: ./cmd/gha
    binary: gha
    ldflags:
      - -s -w -X main.version={{.Version}}
    goos:
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: darwin
    ids:
      - darwin
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

  - id: linux
    ids:
      - linux
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

checksum:
  name_template: checksums.txt

homebrew_casks:
  - name: gha
    ids:
      - darwin
    repository:
      owner: swibrow
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    binaries:
      - gha
    homepage: https://github.com/swibrow/github-actions-tui
    description: Terminal UI for GitHub Actions
    # Lets `brew audit` reconcile the homepage with the download domain.
    url:
      verified: github.com/swibrow/github-actions-tui
    # The binaries are unsigned, so Gatekeeper quarantines them on download.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/gha"]
          end

# Casks are macOS-only, so Linux ships as native packages instead.
nfpms:
  - id: linux
    package_name: gha
    ids:
      - linux
    formats:
      - deb
      - rpm
      - apk
    maintainer: swibrow <15628653+swibrow@users.noreply.github.com>
    homepage: https://github.com/swibrow/github-actions-tui
    description: Terminal UI for GitHub Actions
    license: MIT

changelog:
  use: github-native
